<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Mystery Networking - Winners Podium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/trendy-theme.css">
    
    <!-- API Configuration -->
    <script src="js/firebase-config.js"></script>
    
    <style>
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding-top: 40px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-top: 8px;
        }
        
        /* Confetti Animation */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 100;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confetti-fall 4s ease-in-out forwards;
        }
        
        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(-100px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }
        
        /* Podium Styles */
        .podium-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        
        .podium-winners {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 700px;
        }
        
        .winner-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(50px);
        }
        
        .winner-card.animate {
            animation: winner-reveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @keyframes winner-reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .winner-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 16px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .first .winner-avatar {
            width: 130px;
            height: 130px;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 4px solid #FFD700;
            animation: pulse-gold 2s ease-in-out infinite;
        }
        
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 10px 40px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 10px 40px rgba(0, 0, 0, 0.3); }
        }
        
        .second .winner-avatar {
            background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
            border: 3px solid #C0C0C0;
        }
        
        .third .winner-avatar {
            background: linear-gradient(135deg, #CD7F32, #B87333);
            border: 3px solid #CD7F32;
        }
        
        .winner-medal {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 2rem;
            animation: bounce 1s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .winner-info {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .winner-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .first .winner-name {
            font-size: 1.6rem;
        }
        
        .winner-team {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .winner-score {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .first .winner-score {
            font-size: 1.8rem;
        }
        
        /* Podium Blocks */
        .podium-block {
            width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.9);
            border-radius: 12px 12px 0 0;
            position: relative;
            overflow: hidden;
        }
        
        .first .podium-block {
            height: 180px;
            background: linear-gradient(180deg, #FFD700 0%, #B8860B 100%);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .second .podium-block {
            height: 140px;
            background: linear-gradient(180deg, #C0C0C0 0%, #808080 100%);
        }
        
        .third .podium-block {
            height: 100px;
            background: linear-gradient(180deg, #CD7F32 0%, #8B4513 100%);
        }
        
        .podium-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
        }
        
        /* Sparkle Effects */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* Trophy Animation */
        .trophy-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: trophy-bounce 2s ease-in-out infinite;
        }
        
        @keyframes trophy-bounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            25% { transform: translateY(-10px) rotate(5deg); }
            50% { transform: translateY(0) rotate(-5deg); }
            75% { transform: translateY(-5px) rotate(3deg); }
        }
        
        /* All Participants List */
        .all-participants {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 28px;
            margin-top: 40px;
            width: 100%;
            max-width: 700px;
        }
        
        .all-participants h3 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        
        .participant-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-glass);
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }
        
        .participant-row:hover {
            transform: translateX(5px);
            background: rgba(102, 126, 234, 0.1);
        }
        
        .participant-rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--text-primary);
            margin-right: 16px;
        }
        
        .participant-details {
            flex: 1;
        }
        
        .participant-details .name {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .participant-details .team {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .participant-score {
            font-weight: 700;
            color: var(--text-accent);
            font-size: 1.1rem;
        }
        
        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 50px;
            padding: 12px 24px;
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 50;
        }
        
        .back-btn:hover {
            background: var(--accent-gradient);
            color: white;
            transform: translateX(-5px);
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }
        
        .loading .spinner {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .podium-winners {
                gap: 10px;
            }
            
            .podium-block {
                width: 100px;
            }
            
            .first .podium-block { height: 140px; }
            .second .podium-block { height: 100px; }
            .third .podium-block { height: 70px; }
            
            .winner-avatar {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
            
            .first .winner-avatar {
                width: 90px;
                height: 90px;
                font-size: 2.2rem;
            }
            
            .winner-name {
                font-size: 1rem;
            }
            
            .first .winner-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>
    
    <button class="back-btn" onclick="window.location.href='dashboard.html'">
        ← Back to Dashboard
    </button>
    
    <div class="container fade-in">
        <div class="header">
            <div class="trophy-icon">🏆</div>
            <h1>🎉 Event Winners 🎉</h1>
            <p class="subtitle">Congratulations to our top networkers!</p>
        </div>
        
        <div class="podium-container">
            <div class="podium-winners" id="podiumWinners">
                <div class="loading">
                    <div class="spinner">🔄</div>
                    <p>Loading winners...</p>
                </div>
            </div>
            
            <div class="all-participants" id="allParticipants" style="display: none;">
                <h3>📊 Final Rankings</h3>
                <div id="participantsList"></div>
            </div>
        </div>
    </div>
    
    <script src="js/trendy-theme.js"></script>
    <script>
        const API_BASE_URL = window.API_URL || 'http://localhost:5000/api';
        
        // Team colors and emojis
        const teamColors = {
            'blue': { emoji: '🔵', color: '#3B82F6' },
            'red': { emoji: '🔴', color: '#EF4444' },
            'green': { emoji: '🟢', color: '#10B981' },
            'yellow': { emoji: '🟡', color: '#F59E0B' },
            'purple': { emoji: '🟣', color: '#8B5CF6' }
        };
        
        // Create confetti
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.animationDuration = (3 + Math.random() * 2) + 's';
                    
                    // Random shapes
                    const shapes = ['50%', '0%', '30%'];
                    confetti.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
                    confetti.style.width = (8 + Math.random() * 8) + 'px';
                    confetti.style.height = (8 + Math.random() * 8) + 'px';
                    
                    container.appendChild(confetti);
                    
                    // Remove after animation
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }
        
        // Load leaderboard and display winners
        async function loadWinners() {
            try {
                const response = await fetch(`${API_BASE_URL}/leaderboard`);
                if (!response.ok) throw new Error('Failed to fetch leaderboard');
                
                const leaderboard = await response.json();
                console.log('Leaderboard data:', leaderboard);
                
                if (!leaderboard || leaderboard.length === 0) {
                    document.getElementById('podiumWinners').innerHTML = `
                        <div class="loading">
                            <p>No participants found yet.</p>
                            <p style="margin-top: 10px;">Start the event to see winners!</p>
                        </div>
                    `;
                    return;
                }
                
                // Sort by score descending
                leaderboard.sort((a, b) => (b.score || 0) - (a.score || 0));
                
                displayPodium(leaderboard);
                displayAllParticipants(leaderboard);
                
                // Start confetti after a short delay
                setTimeout(createConfetti, 500);
                
                // Repeat confetti every 8 seconds
                setInterval(createConfetti, 8000);
                
            } catch (error) {
                console.error('Error loading winners:', error);
                document.getElementById('podiumWinners').innerHTML = `
                    <div class="loading">
                        <p>⚠️ Failed to load winners</p>
                        <p style="margin-top: 10px; font-size: 0.9rem;">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function displayPodium(leaderboard) {
            const top3 = leaderboard.slice(0, 3);
            const podiumContainer = document.getElementById('podiumWinners');
            
            // Reorder for podium display: 2nd, 1st, 3rd
            const podiumOrder = [];
            if (top3[1]) podiumOrder.push({ ...top3[1], place: 2, class: 'second' });
            if (top3[0]) podiumOrder.push({ ...top3[0], place: 1, class: 'first' });
            if (top3[2]) podiumOrder.push({ ...top3[2], place: 3, class: 'third' });
            
            const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
            const avatars = { 1: '👑', 2: '⭐', 3: '✨' };
            
            let html = '';
            
            podiumOrder.forEach((winner, index) => {
                const team = teamColors[winner.color] || { emoji: '⚪', color: '#888' };
                
                html += `
                    <div class="winner-card ${winner.class}" style="animation-delay: ${index * 0.3 + 0.5}s;">
                        <div class="winner-avatar">
                            ${avatars[winner.place]}
                            <span class="winner-medal">${medals[winner.place]}</span>
                        </div>
                        <div class="winner-info">
                            <div class="winner-name">${winner.name || 'Anonymous'}</div>
                            <div class="winner-team">${team.emoji} ${winner.color || 'Unknown'} Team</div>
                            <div class="winner-score">${winner.score || 0} pts</div>
                        </div>
                        <div class="podium-block">${winner.place}</div>
                    </div>
                `;
            });
            
            podiumContainer.innerHTML = html;
            
            // Trigger animations
            setTimeout(() => {
                document.querySelectorAll('.winner-card').forEach((card, i) => {
                    setTimeout(() => card.classList.add('animate'), i * 300);
                });
            }, 100);
        }
        
        function displayAllParticipants(leaderboard) {
            const container = document.getElementById('allParticipants');
            const list = document.getElementById('participantsList');
            
            if (leaderboard.length <= 3) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            
            let html = '';
            leaderboard.forEach((participant, index) => {
                const team = teamColors[participant.color] || { emoji: '⚪', color: '#888' };
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                
                html += `
                    <div class="participant-row" style="animation-delay: ${index * 0.05}s;">
                        <div class="participant-rank" style="background: ${index < 3 ? 'var(--accent-gradient)' : 'var(--bg-secondary)'}; color: ${index < 3 ? 'white' : 'var(--text-primary)'};">
                            ${medal}
                        </div>
                        <div class="participant-details">
                            <div class="name">${participant.name || 'Anonymous'}</div>
                            <div class="team">${team.emoji} ${participant.color || 'Unknown'} Team • ${participant.scanned_count || 0} scans</div>
                        </div>
                        <div class="participant-score">${participant.score || 0} pts</div>
                    </div>
                `;
            });
            
            list.innerHTML = html;
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadWinners();
        });
    </script>
</body>
</html>
