<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Networking - Dashboard</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        .stat-label {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .leaderboard {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .leaderboard h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 1.2em;
        }
        
        .rank {
            font-weight: bold;
            color: #ffd700;
            margin-left: 10px;
        }
        
        .score {
            font-weight: bold;
            color: #4ade80;
        }
        
        .loading {
            text-align: center;
            font-size: 1.5em;
            margin: 50px 0;
        }
        
        .color-progress-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .color-progress {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .color-info {
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }
        
        .color-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .color-stats {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .progress-bar {
            flex-grow: 1;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s ease;
        }
        
        .percentage {
            font-weight: bold;
            min-width: 50px;
            text-align: right;
        }
        
        .no-data, .error {
            text-align: center;
            font-size: 1.2em;
            margin: 30px 0;
            opacity: 0.7;
        }
        
        .error {
            color: #ff6b6b;
        }

        /* Focus indicators */
        button:focus-visible, a:focus-visible {
            outline: 3px solid #ffd700;
            outline-offset: 2px;
        }

        /* Dark Mode */
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Mystery Networking Dashboard</h1>
            <p>Live Event Statistics</p>
        </div>
        
        <div class="stats-grid" role="region" aria-label="Live event statistics">
            <div class="stat-card" role="img" aria-label="Total participants">
                <div class="stat-number" id="totalParticipants" aria-live="polite">-</div>
                <div class="stat-label">Total Participants</div>
            </div>
            
            <div class="stat-card" role="img" aria-label="Total scans">
                <div class="stat-number" id="totalScans" aria-live="polite">-</div>
                <div class="stat-label">Total Scans</div>
            </div>
            
            <div class="stat-card" role="img" aria-label="Active now">
                <div class="stat-number" id="activeNow" aria-live="polite">-</div>
                <div class="stat-label">Active Now</div>
            </div>
            
            <div class="stat-card" role="img" aria-label="Completion rate">
                <div class="stat-number" id="avgScore" aria-live="polite">-</div>
                <div class="stat-label">Completion Rate</div>
            </div>
        </div>
        
        <div class="leaderboard">
            <h2>📊 Color Team Progress</h2>
            <div id="colorProgress" class="color-progress-container">Loading team progress...</div>
        </div>
        
        <div class="leaderboard">
            <h2>🏆 Live Leaderboard</h2>
            <div id="leaderboardContent" class="loading">Loading leaderboard...</div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/trendy-theme.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
